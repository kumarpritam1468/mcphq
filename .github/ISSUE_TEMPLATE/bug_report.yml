name: Bug report
description: Something in mcphq isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If this is a **security vulnerability** (e.g. mcphq writing outside its intended target, corrupting a config, or leaking a secret), please don't file it here — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact `mcphq` command(s) you ran, and a minimal `mcp.config.json` if relevant.
      placeholder: |
        1. `mcphq init --no-input`
        2. Add this to mcp.config.json: ...
        3. `mcphq sync`
        4. See error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mcphq version / commit
      description: Output of `mcphq --version`, or the git commit SHA if running from source.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: Which AI client(s) are involved, if any?
      multiple: true
      options:
        - Claude Code
        - Cursor
        - VS Code (GitHub Copilot)
        - Codex CLI
        - Not client-specific
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the full terminal output. It'll be formatted as code automatically.
      render: shell
