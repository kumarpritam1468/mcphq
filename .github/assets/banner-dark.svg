<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcphq — your MCP headquarters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- hub-and-spoke icon: mcp.config.json syncing out to 4 clients -->
  <g transform="translate(940,60)" stroke-linecap="round">
    <circle cx="0" cy="70" r="10" fill="#22d3ee"/>
    <line x1="9" y1="65" x2="60" y2="18" stroke="url(#accent)" stroke-width="2.5" opacity="0.85"/>
    <line x1="9" y1="70" x2="62" y2="70" stroke="url(#accent)" stroke-width="2.5" opacity="0.85"/>
    <line x1="9" y1="75" x2="60" y2="122" stroke="url(#accent)" stroke-width="2.5" opacity="0.85"/>
    <line x1="6" y1="78" x2="52" y2="150" stroke="url(#accent)" stroke-width="2.5" opacity="0.6"/>
    <circle cx="68" cy="14" r="6" fill="#e5e7eb"/>
    <circle cx="70" cy="70" r="6" fill="#e5e7eb"/>
    <circle cx="68" cy="126" r="6" fill="#e5e7eb"/>
    <circle cx="58" cy="156" r="6" fill="#e5e7eb" opacity="0.75"/>
  </g>

  <text x="70" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f9fafb">mcphq</text>
  <text x="75" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#9ca3af">Your MCP headquarters</text>
  <text x="75" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#22d3ee">Define every server once. Sync it everywhere.</text>

  <rect x="75" y="215" width="7" height="7" rx="1.5" fill="#22d3ee"/>
  <text x="92" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7280">Claude Code</text>
  <rect x="205" y="215" width="7" height="7" rx="1.5" fill="#818cf8"/>
  <text x="222" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7280">Cursor</text>
  <rect x="303" y="215" width="7" height="7" rx="1.5" fill="#22d3ee"/>
  <text x="320" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7280">VS Code</text>
  <rect x="418" y="215" width="7" height="7" rx="1.5" fill="#818cf8"/>
  <text x="435" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7280">Codex</text>
</svg>
